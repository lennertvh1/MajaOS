# Checks every push to dev and main, and every pull request: syntax of all JavaScript and shell scripts, and the tests.
# On dev, pushes that touch the installer run a live ISO build as a smoke test (no upload — ISOs are huge and eat Actions artifact quota).
# To download a test ISO: Actions > Test > Run workflow (branch dev, "Also build a test ISO" on). Upload is only on manual runs (7 days).
# Test servers follow the dev branch through Settings > Software update > Development.
name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
    inputs:
      iso:
        description: "Also build a test ISO"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax
        run: |
          node --check server.js
          for f in lib/*.js public/*.js public/lang/*.js test/*.js; do node --check "$f"; done
          for f in install.sh deploy/*.sh iso/*.sh lib/*.sh; do bash -n "$f"; done

      - name: Tests
        run: npm test

      - name: Installer changed?
        id: changed
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(iso/|install\.sh|deploy/|public/install\.(html|js))'; then echo "iso=true" >> "$GITHUB_OUTPUT"; fi

    outputs:
      iso: ${{ steps.changed.outputs.iso == 'true' || (github.event_name == 'workflow_dispatch' && inputs.iso) }}

  iso:
    needs: test
    if: needs.test.outputs.iso == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q xorriso cpio debootstrap squashfs-tools

      - name: Keep the Debian ISO between runs
        uses: actions/cache@v6
        with:
          path: .iso-cache
          key: debian-netinst-${{ github.run_id }}
          restore-keys: debian-netinst-

      - name: Build the test ISO
        run: sudo ./iso/build-iso.sh --live --out dist

      - name: Upload as an artifact
        if: github.event_name == 'workflow_dispatch' && inputs.iso
        uses: actions/upload-artifact@v5
        with:
          name: majaos-test-iso-${{ github.sha }}
          path: dist/*
          retention-days: 7

      - name: ISO built (no upload on push)
        if: github.event_name == 'push'
        run: |
          ls -lh dist/
          echo "Push builds verify the ISO only. To download: Actions → Test → Run workflow on dev with a free artifact quota."
