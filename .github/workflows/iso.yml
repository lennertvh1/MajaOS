# Creates the MajaOS release on GitHub and attaches the installation ISO. Only when a tag is pushed, never for a plain push.
# Official versions are tags on main. Pre-releases (a tag with a -, e.g. v0.1.0-beta.1) may also be tags on dev.
# - Automatically for every pushed tag (e.g. v0.1.0): the release gets the tag message as title and text
#   (git tag -a v0.1.0 -F notes.md: first line = title, the rest = text in Markdown). A tag with a - becomes a pre-release.
# - A release you create yourself on github.com also gets an ISO.
# - By hand: Actions > "Release and ISO" > Run workflow, and fill in the tag.
# A release this workflow creates itself doesn't start other workflows; that's why the ISO is built here too.
name: Release and ISO

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, e.g. v0.1.0 or v0.1.0-beta.1 (if the release doesn't exist yet, it is created)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Only from main (pre-releases also from dev)
        run: |
          head="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$head" origin/main && exit 0
          case "$TAG" in *-*) git merge-base --is-ancestor "$head" origin/dev && exit 0 ;; esac
          echo "::error::$TAG is not on main. Official releases come from main; a pre-release (a tag with a -, e.g. v0.1.0-beta.1) may also come from dev."
          exit 1

      - name: Check the version
        run: |
          v="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          [ "v$v" = "$TAG" ] || { echo "::error::package.json has version $v, but the tag is $TAG. Make them the same."; exit 1; }

      - name: Create the release (if it doesn't exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "The release $TAG already exists."; exit 0; fi
          gh auth setup-git
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          title="$(git tag -l --format='%(contents:subject)' "$TAG")"
          git tag -l --format='%(contents:body)' "$TAG" > notes.md
          [ -s notes.md ] || echo "See the changes in the commits." > notes.md
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "${title:-$TAG}" --notes-file notes.md $pre

  iso:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q xorriso cpio debootstrap squashfs-tools

      - name: Keep the Debian ISO between runs
        uses: actions/cache@v6
        with:
          path: .iso-cache
          key: debian-netinst-${{ github.run_id }}
          restore-keys: debian-netinst-

      - name: Build the ISO
        run: sudo ./iso/build-iso.sh --live --out dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.iso dist/*.sha256 --clobber
