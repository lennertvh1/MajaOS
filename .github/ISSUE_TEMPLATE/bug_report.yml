name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Storage
        2. Click Create pool
        3. …
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: For example `journalctl -u majaos -e`. Remove passwords and addresses you don't want to share.
      render: text
  - type: input
    id: where
    attributes:
      label: Where does it run?
      placeholder: Real hardware (Ryzen 7 5700X), Proxmox VM, the demo…
