<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
</head>
<body class="console-page terminal-page">
  <header class="console-bar">
    <a class="btn sm back" href="/" aria-label="Terug naar HomeBaseOS" data-t-label title="Terug naar HomeBaseOS">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div class="console-title"><b data-t>Terminal op de server</b> <span class="pill" id="tState"></span></div>
    <div class="btn-row console-tools">
      <button class="btn sm" type="button" id="tReconnect" hidden data-t>Opnieuw verbinden</button>
      <button class="btn sm" type="button" id="tPop" hidden data-t>Los venster</button>
      <button class="btn sm" type="button" id="tClose" hidden aria-label="Sluiten" data-t-label title="Sluiten">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </header>
  <main class="console-screen term-screen" id="term" aria-label="Terminal"></main>
  <div class="console-status" id="tStatus" role="status">
    <p id="tStatusText" data-t>Laden…</p>
    <form class="inline-form" id="tLogin" hidden>
      <input class="field" type="password" id="tPw" autocomplete="current-password" placeholder="Wachtwoord van HomeBaseOS" data-t-ph aria-label="Wachtwoord van HomeBaseOS">
      <button class="btn primary" type="submit" data-t>Openen</button>
    </form>
    <p class="form-error" id="tError" role="alert"></p>
    <div class="btn-row" id="tStatusBtns"></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="lang/en.js"></script>
  <script src="demo.js"></script>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
