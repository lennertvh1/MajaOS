<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="console-page">
  <header class="console-bar">
    <a class="btn sm back" href="/#vms" aria-label="Back to HomeBaseOS" data-t-label title="Back to HomeBaseOS">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div class="console-title"><b id="cName">…</b> <span class="pill" id="cState"></span></div>
    <div class="btn-row console-tools">
      <button class="btn sm" type="button" id="cKeys" disabled>Ctrl+Alt+Del</button>
      <button class="btn sm" type="button" id="cType" aria-expanded="false" disabled data-t>Type text</button>
      <button class="btn sm" type="button" id="cScale" aria-pressed="true" data-t>Fit to window</button>
      <button class="btn sm" type="button" id="cFull" data-t>Full screen</button>
      <button class="btn sm" type="button" id="cPop" hidden data-t>Pop out</button>
      <button class="btn sm" type="button" id="cClose" hidden aria-label="Close" data-t-label title="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </header>
  <div class="console-clip" id="cClip" hidden role="status">
    <span id="cClipText"></span>
    <button class="btn sm primary" type="button" id="cClipCopy" data-t>Copy to this PC</button>
    <button class="btn sm" type="button" id="cClipHide" data-t>Hide</button>
  </div>
  <textarea id="cPasteSink" class="paste-sink" tabindex="-1" aria-hidden="true"></textarea>
  <form class="console-typebar" id="cTypeBar" hidden>
    <input class="field" id="cText" autocomplete="off" spellcheck="false" placeholder="Text for the VM, e.g. a long password" data-t-ph>
    <label class="check"><input type="checkbox" id="cEnter"> <span data-t>Then Enter</span></label>
    <button class="btn sm primary" type="submit" data-t>Type text</button>
  </form>
  <main class="console-screen" id="screen" aria-label="VM screen"></main>
  <div class="console-status" id="cStatus" role="status">
    <p id="cStatusText" data-t>Loading…</p>
    <div class="btn-row" id="cStatusBtns"></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="lang/languages.js"></script>
  <script src="demo.js"></script>
  <script src="console.js"></script>
</body>
</html>
