<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thuisbasis</title>
  <meta name="theme-color" content="#101a33">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Achtergrond: een vlak landschap bij schemer -->
  <svg class="wallpaper" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" class="sky-top"/><stop offset=".62" class="sky-mid"/><stop offset="1" class="sky-low"/>
      </linearGradient>
      <radialGradient id="glow" cx=".72" cy=".74" r=".5">
        <stop offset="0" class="glow-in"/><stop offset="1" class="glow-out"/>
      </radialGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#sky)"/>
    <rect width="1600" height="900" fill="url(#glow)"/>
    <g class="stars"></g>
    <path class="land far" d="M0 700 C 220 680 380 690 560 676 S 920 664 1120 678 1420 668 1600 674 V900 H0Z"/>
    <path class="land mid" d="M0 748 C 260 730 470 742 700 728 S 1100 720 1330 734 1520 728 1600 732 V900 H0Z"/>
    <g class="trees">
      <path d="M1180 734 v-34 m0 0 c-9 6 -13 16 -12 24 h24 c1 -8 -3 -18 -12 -24z"/>
      <path d="M1214 736 v-46 m0 0 c-12 9 -17 22 -16 34 h32 c1 -12 -4 -25 -16 -34z"/>
      <path d="M1246 735 v-28 m0 0 c-8 5 -11 13 -10 20 h20 c1 -7 -2 -15 -10 -20z"/>
      <path d="M318 744 v-30 m0 0 c-8 6 -12 14 -11 21 h22 c1 -7 -3 -15 -11 -21z"/>
    </g>
    <path class="land near" d="M0 800 C 300 780 600 794 900 782 S 1400 778 1600 786 V900 H0Z"/>
  </svg>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15.5 16 6l11 9.5V27H19.5v-7.5h-7V27H5z"/></svg>
        <span class="brand-name">Thuisbasis</span>
        <span class="host" id="host"></span>
        <span class="demo-badge" id="demoBadge" hidden>Demo</span>
      </div>
      <nav class="topnav" aria-label="Beheer">
        <button class="nav-btn" data-open="store" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span>Appstore</span>
        </button>
        <button class="nav-btn" data-open="storage" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
          <span>Opslag</span>
        </button>
        <button class="nav-btn" data-open="vms" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span>VM's</span>
        </button>
        <button class="nav-btn" data-open="ai" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18.5 15l.8 2.1 2.2.9-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.9z"/></svg>
          <span>AI</span>
        </button>
        <a class="nav-btn icon-only" href="#settings" data-nav="settings" aria-label="Instellingen" title="Instellingen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </a>
        <button class="nav-btn icon-only" id="logoutBtn" type="button" hidden aria-label="Afmelden">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
        </button>
      </nav>
    </header>

    <main class="desk" id="desk">
      <aside class="widgets" aria-label="Overzicht">
        <section class="widget clock-widget">
          <p class="greeting" id="greeting">Goedendag</p>
          <p class="clock" id="clock">--:--</p>
          <p class="date" id="date"></p>
        </section>

        <section class="widget" id="sysWidget" aria-labelledby="sysTitle">
          <header class="widget-head"><h2 id="sysTitle">Systeem</h2><span class="muted small" id="uptime"></span></header>
          <div class="sys-grid">
            <div class="ring-wrap">
              <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
                <circle class="ring-track" cx="22" cy="22" r="18"/><circle class="ring-fill" id="cpuRing" cx="22" cy="22" r="18"/>
              </svg>
              <div class="ring-label"><strong id="cpuPct">–</strong><span>CPU</span></div>
            </div>
            <div class="ring-wrap">
              <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
                <circle class="ring-track" cx="22" cy="22" r="18"/><circle class="ring-fill" id="memRing" cx="22" cy="22" r="18"/>
              </svg>
              <div class="ring-label"><strong id="memPct">–</strong><span>RAM</span></div>
            </div>
            <div class="ring-wrap" id="gpuRingWrap" hidden>
              <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
                <circle class="ring-track" cx="22" cy="22" r="18"/><circle class="ring-fill" id="gpuRing" cx="22" cy="22" r="18"/>
              </svg>
              <div class="ring-label"><strong id="gpuPct">–</strong><span>VRAM</span></div>
            </div>
          </div>
          <dl class="facts" id="sysFacts"></dl>
        </section>

        <button class="widget widget-btn" data-open="storage" type="button" aria-label="Opslag openen">
          <header class="widget-head"><h2>Opslag</h2><span class="pill" id="arrayState"></span></header>
          <p class="big-stat"><strong id="storeFree">–</strong> <span id="storeFreeLabel">vrij</span></p>
          <div class="bar" aria-hidden="true"><span id="storeBar"></span></div>
          <p class="muted small" id="storeLine"></p>
        </button>

        <button class="widget widget-btn" data-open="ai" type="button" aria-label="AI openen">
          <header class="widget-head"><h2>AI</h2><span class="pill" id="aiState"></span></header>
          <p class="ai-line" id="aiLine">–</p>
          <p class="muted small" id="aiSub"></p>
        </button>

        <button class="widget widget-btn" data-open="vms" type="button" aria-label="Virtuele machines openen">
          <header class="widget-head"><h2>Virtuele machines</h2><span class="muted small" id="vmWidgetCount"></span></header>
          <ul class="vm-mini" id="vmMini"></ul>
        </button>
      </aside>

      <section class="apps-area" aria-labelledby="appsTitle">
        <div class="apps-bar">
          <div class="apps-title">
            <h1 id="appsTitle">Apps <span class="count" id="appCount"></span></h1>
            <div class="upd-info" id="updInfo" aria-live="polite"></div>
          </div>
          <div class="apps-tools">
            <label class="search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="search" type="search" placeholder="Zoek een app" autocomplete="off">
            </label>
            <div class="seg" role="radiogroup" aria-label="Filter apps" id="filters">
              <button type="button" role="radio" aria-checked="true" data-filter="all">Alle</button>
              <button type="button" role="radio" aria-checked="false" data-filter="running">Actief</button>
              <button type="button" role="radio" aria-checked="false" data-filter="stopped">Gestopt</button>
              <button type="button" role="radio" aria-checked="false" data-filter="update">Updates</button>
            </div>
            <a class="btn primary" href="#store">App toevoegen</a>
          </div>
        </div>
        <div class="app-grid" id="appGrid" aria-live="polite"></div>
      </section>
    </main>

    <main class="page" id="vmPage" hidden aria-labelledby="vmTitle">
      <div class="apps-bar">
        <div class="page-title">
          <a class="btn back" href="#" aria-label="Terug naar het overzicht">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
          </a>
          <h1 id="vmTitle">Virtuele machines <span class="count" id="vmCount"></span></h1>
        </div>
        <div class="apps-tools">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="vmSearch" type="search" placeholder="Zoek een VM" autocomplete="off">
          </label>
          <div class="seg" role="radiogroup" aria-label="Filter VM's" id="vmFilters">
            <button type="button" role="radio" aria-checked="true" data-filter="all">Alle</button>
            <button type="button" role="radio" aria-checked="false" data-filter="on">Actief</button>
            <button type="button" role="radio" aria-checked="false" data-filter="paused">Gepauzeerd</button>
            <button type="button" role="radio" aria-checked="false" data-filter="off">Uit</button>
          </div>
          <a class="btn" href="#settings/vmnet" id="vmNets">Netwerken</a>
          <button class="btn primary" type="button" id="vmNew">Nieuwe VM</button>
        </div>
      </div>
      <div class="vm-list" id="vmList" aria-live="polite"></div>
    </main>

    <main class="page" id="storePage" hidden aria-labelledby="storeTitle">
      <div class="apps-bar">
        <div class="page-title">
          <a class="btn back" href="#" aria-label="Terug naar het overzicht">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
          </a>
          <h1 id="storeTitle">Appstore <span class="count" id="storeCount"></span></h1>
        </div>
        <div class="apps-tools">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="storeSearch" type="search" placeholder="Zoek tussen alle apps" autocomplete="off">
          </label>
          <select class="field store-cat" id="storeCat" aria-label="Categorie">
            <option value="featured">Aanbevolen</option>
            <option value="all">Alle apps</option>
          </select>
        </div>
      </div>
      <p class="store-source muted small" id="storeSource"></p>
      <div class="store-grid" id="storeGrid" aria-live="polite"></div>
      <div class="store-more"><button class="btn" type="button" id="storeMore" hidden>Meer tonen</button></div>
    </main>

    <main class="center-screen" id="loginScreen" hidden>
      <form class="panel login" id="loginForm">
        <h1>Welkom terug</h1>
        <label for="pw">Wachtwoord</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <p class="form-error" id="loginError" role="alert"></p>
        <button class="btn primary" type="submit">Aanmelden</button>
      </form>
    </main>
  </div>

  <dialog class="window" id="win" aria-labelledby="winTitle">
    <header class="win-head">
      <h2 id="winTitle"></h2>
      <button class="close" type="button" id="winClose" aria-label="Sluiten">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="win-body" id="winBody"></div>
  </dialog>

  <!-- Instellingen: een venster met zijbalk, zoals Systeeminstellingen op macOS -->
  <dialog class="window settings-win" id="setWin" aria-labelledby="setWinTitle">
    <nav class="set-side" role="tablist" aria-orientation="vertical" aria-label="Instellingen" id="setTabs">
      <p class="set-side-title">Instellingen</p>
      <a role="tab" href="#settings" data-tab="general" id="tab-general" aria-controls="setPane">
        <span class="set-ico gray"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></span>Algemeen</a>
      <a role="tab" href="#settings/network" data-tab="network" id="tab-network" aria-controls="setPane">
        <span class="set-ico blue"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></span>Netwerk</a>
      <a role="tab" href="#settings/docker" data-tab="docker" id="tab-docker" aria-controls="setPane">
        <span class="set-ico cyan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-2h12v2"/></svg></span>Docker-netwerken</a>
      <a role="tab" href="#settings/vmnet" data-tab="vmnet" id="tab-vmnet" aria-controls="setPane">
        <span class="set-ico indigo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span>VM-netwerken</a>
      <a role="tab" href="#settings/about" data-tab="about" id="tab-about" aria-controls="setPane">
        <span class="set-ico slate"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></span>Over</a>
    </nav>
    <div class="set-main">
      <header class="win-head">
        <h2 id="setWinTitle">Algemeen</h2>
        <button class="close" type="button" id="setClose" aria-label="Sluiten">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <section class="win-body set-pane" id="setPane" role="tabpanel" tabindex="-1" autofocus></section>
    </div>
  </dialog>

  <dialog class="window console-win" id="conWin" aria-label="Console">
    <iframe id="conFrame" title="Console" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  </dialog>

  <dialog class="window ask" id="ask" aria-labelledby="askText">
    <div class="win-body">
      <p id="askText"></p>
      <label class="check" id="askCheckWrap" hidden><input type="checkbox" id="askCheck"> <span id="askCheckText"></span></label>
      <div class="btn-row ask-row">
        <button class="btn" type="button" id="askNo">Annuleren</button>
        <button class="btn primary" type="button" id="askYes">Doorgaan</button>
      </div>
    </div>
  </dialog>

  <div class="menu" id="appMenu" role="menu" aria-label="Acties voor deze app" hidden></div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="lang/en.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
