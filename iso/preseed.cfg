#### HomeBaseOS: antwoorden voor de Debian 13-installer (preseed).
# Zit in de initrd van de ISO, zodat ook de eerste vragen (taal, toetsenbord) al beantwoord zijn.
# Bewust NIET beantwoord, dus de installer vraagt het:
#   - op welke schijf Debian komt (anders zou een schijf met data gewist kunnen worden),
#   - de bevestiging vóór het wissen van die schijf,
#   - het wachtwoord van de beheerder (gebruiker "homebase", voor SSH en sudo).

### Taal, land en toetsenbord
d-i debian-installer/locale string nl_BE.UTF-8
d-i debian-installer/language string nl
d-i debian-installer/country string BE
d-i localechooser/supported-locales multiselect en_US.UTF-8, nl_BE.UTF-8
d-i keyboard-configuration/xkb-keymap select be

### Netwerk (DHCP). De naam kan je later wijzigen in de welkomstwizard.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string homebaseos
d-i netcfg/hostname string homebaseos
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean true

### Pakketbron
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates

### Gebruikers: geen root-wachtwoord, één beheerder met sudo
d-i passwd/root-login boolean false
d-i passwd/user-fullname string HomeBaseOS
d-i passwd/username string homebase

### Klok
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Brussels
d-i clock-setup/ntp boolean true

### Schijf: de hele gekozen schijf, standaardindeling (EFI, root, swap)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
# partman/confirm blijft open: de installer vraagt "Veranderingen naar de schijf schrijven?"

### Software: alleen het basissysteem en SSH. De rest installeert HomeBaseOS bij de eerste opstart.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Opstartlader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

### Afwerken: HomeBaseOS klaarzetten voor de eerste opstart
d-i preseed/late_command string sh /cdrom/homebaseos/late.sh
d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note
